<!DOCTYPE html>
<html>
<head>
  <title>Matrimonial Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h1 class="mb-3">Matrimonial Profiles</h1>

    <form class="mb-3" method="get">
      <input class="form-control" name="q" placeholder="Search by name or city" value="{{ q }}">
    </form>

    <div class="row">
      {% for p in profiles %}
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <h5>{{ p.name }}</h5>
            <p>Age: {{ p.age }}<br>City: {{ p.city }}<br>Profession: {{ p.profession }}<br>Education: {{ p.education }}<br>Religion: {{ p.religion }}</p>
          </div>
        </div>
      </div>
      {% empty %}
      <p>No profiles found.</p>
      {% endfor %}
    </div>
  </div>
</body>
</html>
